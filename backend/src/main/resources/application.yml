
  spring:
    config:
      import: "optional:file:../.env[.properties],optional:file:.env[.properties]"

    application:
      name: garment-factory-platform

    profiles:
      default: dev

    datasource:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:garment_factory}?connectionTimeZone=UTC&characterEncoding=UTF-8
      username: ${DB_USER:garment_app}
      password: ${DB_PASSWORD}
      hikari:
        pool-name: gf-hikari
        maximum-pool-size: ${DB_POOL_SIZE:10}
        minimum-idle: 2
        connection-timeout: 10000
        max-lifetime: 1500000

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone: UTC
            batch_size: 50
          order_inserts: true
          order_updates: true

    flyway:
      enabled: true
      locations: classpath:db/migration
      validate-on-migrate: true

    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:}
        timeout: 2s

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 12MB

    lifecycle:
      timeout-per-shutdown-phase: 30s

    mail:
      host: ${MAIL_HOST:localhost}
      port: ${MAIL_PORT:1025}

    web:
      error:
        include-message: never
        include-stacktrace: never
        include-binding-errors: never

  server:
    port: 8080
    shutdown: graceful
    forward-headers-strategy: framework

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        probes:
          enabled: true
        show-details: never
        group:
          readiness:
            include: readinessState,db

  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false

  app:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    mail:
      from: ${MAIL_FROM:no-reply@garmentfactory.local}
    security:
      jwt:
        secret: ${JWT_SECRET}
        issuer: garment-factory-platform
        access-ttl: 15m
      refresh-token:
        ttl: 14d
        cookie-name: gf_refresh
        cookie-secure: ${COOKIE_SECURE:false}
        cookie-same-site: Strict
      login-lockout:
        max-attempts: 5
        lock-duration: 15m
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
    storage:
      local-root: ${STORAGE_LOCAL_ROOT:./data/uploads}
    bootstrap:
      admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
      admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      admin-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
  inventory:
    reservation:
      ttl-minutes: ${INVENTORY_RESERVATION_TTL_MINUTES:30}
    sweeper:
      enabled: ${INVENTORY_SWEEPER_ENABLED:true}
      interval-ms: ${INVENTORY_SWEEPER_INTERVAL_MS:60000}
      initial-delay-ms: ${INVENTORY_SWEEPER_INITIAL_DELAY_MS:30000}
      batch-size: ${INVENTORY_SWEEPER_BATCH_SIZE:100}
      max-batches-per-run: ${INVENTORY_SWEEPER_MAX_BATCHES_PER_RUN:20}