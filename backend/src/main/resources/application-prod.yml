server:
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC&characterEncoding=UTF-8&sslMode=${DB_SSL_MODE:PREFERRED}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    refresh-token:
      cookie-secure: true